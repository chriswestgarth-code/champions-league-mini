name: Update Matchday Standings

on:
  schedule:
    # Runs every day at 04:00 UTC (12:00 PM Taiwan time)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual run button anytime

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scoring Sync
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: node scripts/sync-matchday.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/standings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matchday standings" && git push)
